name: Secret scan

# Catches keys/tokens before they become history. Runs on PRs (untrusted
# forks included — the scanner needs no secrets) and on main as backstop.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
